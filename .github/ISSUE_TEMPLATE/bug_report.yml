name: Bug report
description: Something in Sprout doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sprout version
      description: More → About, for example 1.3.7-github
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options: [GitHub, Obtainium, F-Droid, IzzyOnDroid, Google Play, Other]
